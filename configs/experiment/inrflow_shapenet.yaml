# @package _global_
defaults:
  - override /data: point/shapenet
  - override /model: linear_flow
  - override /model/architecture: pointdit_shapenet
  - override /model/evaluator: pointcloud
  - override /model/sampler: sde_500
  - override /model/processor: shapenet_2048
  - override /callbacks: default
  - override /trainer: default
  - override /logger: tensorboard

# All parameters below will be merged with parameters from default configurations set above 
# this allows you to overwrite only specified parameters
seed: 12345

trainer:
  max_steps: 100000
  val_check_interval: 5000 # this controls BOTH checkpoint steps and validation

data:
  category: ['all']
  batch_size: 16
  val_set_config:
    batch_size: 16
    train: True
    nsamples: 32

model:
  compile: True
  clip_grad_norm_val: 2.0
  sampler:
    clip: True