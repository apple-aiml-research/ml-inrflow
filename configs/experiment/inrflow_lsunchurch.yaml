# @package _global_
defaults:
  - override /data: image/lsunchurch_256
  - override /model: linear_flow
  - override /model/architecture: pixeldit_256
  - override /model/evaluator: image
  - override /model/sampler: ode_100
  - override /model/processor: default
  - override /callbacks: default
  - override /trainer: default
  - override /logger: tensorboard

# All parameters below will be merged with parameters from default configurations set above 
# this allows you to overwrite only specified parameters
seed: 12345

trainer:
  max_steps: 200000
  val_check_interval: 10000 # this controls BOTH checkpoint steps and validation

data:
  batch_size: 8
  val_set_config:
    batch_size: 16
    nsamples: 32

model:
  compile: True
  clip_grad_norm_val: 2.0
  processor:
    npoints_context: [65536]
    npoints_query: [16384]